<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會議寶｜會議成員</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar_a.css') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .btn-primary {
      background-color: #205f72;
    }

    .btn-primary:hover {
      background-color: #175c71;
    }

    .card {
      background-color: #cedfe4;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="navbar-toggle" onclick="toggleSidebar()" id="toggleBtn">
        <i data-lucide="align-justify" class="w-6 h-6 stroke-[#205f72]"></i>
      </button>
      <nav class="menu">
        <div class="sidebar-item cursor-default hover:bg-transparent select-none">
          <i data-lucide="building" class="sidebar-icon stroke-[#205f72]"></i>
          <div class="flex flex-col leading-snug">
            <span class="text-xs text-gray-500">目前會議</span>
            <span id="meeting-date" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
            <span id="meeting-name" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
          </div>
        </div>

        </script>
        <a href="{{ url_for('file.meeting_after_file_upload_page', meeting_id=meeting_id) }}" class="sidebar-item">
          <i data-lucide="file-plus" class="sidebar-icon"></i>
          <span>檔案上傳</span>
        </a>
        <a href="{{ url_for('transcript_file_page', meeting_id=meeting_id) }}" class="sidebar-item">
          <i data-lucide="mic" class="sidebar-icon"></i>
          <span>語音轉文字</span>
        </a>
        <a href="{{ url_for('permission.meeting_review_page', meeting_id=meeting_id) }}" class="sidebar-item">
          <i data-lucide="folder-search-2" class="sidebar-icon"></i>
          <span>會議回顧</span>
        </a>
        <a href="{{ url_for('qa.meeting_qa_history', meeting_id=meeting_id) }}" class="sidebar-item">
          <i data-lucide="search" class="sidebar-icon"></i>查詢紀錄
        </a>
        <a href="{{ url_for('meeting_formal_doc_page', meeting_id=meeting_id) }}" class="sidebar-item">
          <i data-lucide="file-text" class="sidebar-icon"></i>
          <span>正式文件</span>
        </a>
        <a href="#" class="sidebar-item flex items-center gap-2" onclick="openHelpModal()">
          <i data-lucide="circle-question-mark" class="sidebar-icon"></i>
          <span>使用說明</span>
        </a>
        <a href="#" onclick="endMeeting()" class="sidebar-item flex items-center gap-2 
          hover:bg-red-200 
          text-red-600 hover:text-red-600 
          font-semibold rounded-md">
          <i data-lucide="power" class="sidebar-icon stroke-red-600"></i>
          <span>結束會議</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <a href="{{ url_for('organization.build_organization_page') }}">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" class="logo-img" />
          </a>
        </div>

        <div class="progress-bar">
          <div class="step-group">
            <div class="circle gray-completed"></div>
            <div class="label label-gray">前</div>
          </div>
          <div class="line solid-gray"></div>
          <div class="step-group">
            <div class="circle gray-completed"></div>
            <div class="label label-gray">中</div>
          </div>
          <div class="line solid-gray"></div>
          <div class="step-group">
            <div class="circle green-completed"></div>
            <div class="label label-green">後</div>
          </div>
        </div>

        <div class="header-right">
          <a href="{{ url_for('permission.meeting_member3_page', meeting_id=meeting_id) }}">
            <img src="{{ url_for('static', filename='image/head.png') }}" alt="Head" class="avatar-img" />
          </a>
        </div>
      </header>

      <div class="w-full max-w-4xl mx-auto px-4 mt-6">
        <h2 class="text-center text-[#205f72] text-2xl font-bold mb-4">會議參與者列表</h2>
        <div id="memberList" class="flex flex-col gap-3 mb-8"></div>

        <div class="card" id="addMemberCard" style="display: none;">
          <h2 class="text-xl font-bold text-[#205f72] mb-4">新增會議參與者</h2>
          <div class="flex items-center justify-between gap-4">
            <!-- Email 下拉 -->
            <select id="orgMemberDropdown"
              class="flex-grow rounded-full px-4 py-2 shadow text-base focus:outline-none bg-white">
            </select>

            <!-- 權限選單 -->
            <select id="orgMemberRole" class="rounded-full px-4 py-2 shadow text-base bg-white focus:outline-none">
              <option value="edit">可供編輯</option>
              <option value="view">僅可查看</option>
            </select>

            <!-- 新增按鈕 -->
            <button onclick="addSelectedOrgMember()"
              class="bg-[#205f72] text-white px-6 py-2 rounded-full shadow hover:bg-[#175c71]">
              新增
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const role = "{{ role }}";
    const userEmail = "{{ user_email }}";
    function toggleSidebar() {

      document.getElementById("sidebar").classList.toggle("collapsed");
    }
    function goToNext() {
      // 可以根據流程跳到下一頁（範例路徑，可改）
      window.location.href = "{{ url_for('meeting_during_transcript_now_page', meeting_id=meeting_id) }}";
    }

    // 取得會議成員（Flask API）
    function renderMembers() {
      const container = document.getElementById("memberList");
      container.innerHTML = "";

      const meetingId = "{{ meeting_id }}";

      fetch(`/api/meeting_members/${meetingId}`)
        .then(res => res.json())
        .then(data => {
          if (!data.success || !data.members.length) {
            container.innerHTML = '<p class="text-center text-gray-600">尚無會議參與者</p>';
            return;
          }

          data.members.forEach(entry => {
            const div = document.createElement("div");
            div.className = "bg-white border border-gray-300 rounded px-4 py-3 flex justify-between items-center flex-wrap";

            let selectHTML = "";
            if (entry.role === "主持人") {
              selectHTML = `
      <select class="border border-gray-300 rounded px-2 py-1 text-sm w-[100px]" disabled>
        <option value="edit" selected>可供編輯</option>
      </select>
    `;
            } else {
              selectHTML = `
      <select class="border border-gray-300 rounded px-2 py-1 text-sm w-[100px]"
              data-email="${entry.email}"
              onchange="updateMemberRole('${entry.email}', this.value)">
        <option value="edit" ${entry.role === 'edit' ? 'selected' : ''}>可供編輯</option>
        <option value="view" ${entry.role === 'view' ? 'selected' : ''}>僅可查看</option>
      </select>
    `;
            }

            let deleteButtonHTML = "";
            if (role === "主持人") {
              if (entry.email !== "{{ user_email }}") {
                deleteButtonHTML = `
      <button onclick="removeMember('${entry.email}')" class="ml-1" title="移除成員">
        <i data-lucide="x" class="w-5 h-5 stroke-red-600 hover:stroke-red-800"></i>
      </button>
    `;
              } else {
                deleteButtonHTML = `
      <button disabled class="ml-1 cursor-not-allowed" title="無法刪除自己">
        <i data-lucide="x" class="w-5 h-5 stroke-gray-400"></i>
      </button>
    `;
              }
            }


            div.innerHTML = `
    <span class="text-sm text-gray-800 w-full sm:w-auto">${entry.email}</span>
    <div class="flex items-center gap-2 mt-2 sm:mt-0">
      <span class="text-sm text-gray-500">${entry.role === '主持人' ? '主持人' : '參與者'}</span>
      ${selectHTML}
      ${deleteButtonHTML}
    </div>
  `;

            container.appendChild(div);
          });


          lucide.createIcons();  // ⬅ 重新渲染新加入的 icon
        })

        .catch(err => {
          container.innerHTML = '<p class="text-center text-red-600">載入失敗</p>';
          console.error("載入會議成員失敗：", err);
        });
    }

    // 新增會議成員（建議用 API）
    function addNewMember() {
      const input = document.getElementById("newMemberEmail");
      const roleSelect = document.getElementById("newMemberRole");
      const email = input.value.trim();
      const role = roleSelect.value;
      const meetingId = "{{ meeting_id }}";
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert("請輸入有效的 Email 地址");
        return;
      }

      fetch(`/api/meeting_members/${meetingId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, role })  // key 用 role
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            renderMembers();
            input.value = "";
          } else {
            alert(result.message || "新增失敗");
          }
        });
    }


    document.addEventListener("DOMContentLoaded", () => {
      renderMembers();
      loadOrganizationMembers();
      document.getElementById("meeting-name").textContent = localStorage.getItem("currentMeetingName") || "未命名會議";
      document.getElementById("meeting-date").textContent = localStorage.getItem("currentMeetingDate") || "未指定日期";
      lucide.createIcons();

      // ✅ 正確控制新增卡片的顯示權限
      const addCard = document.getElementById("addMemberCard");
      if (role === "主持人") {
        addCard.style.display = "block";
      } else {
        addCard.style.display = "none";
      }

      document.getElementById("newMemberEmail")?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") addNewMember();
      });

      // ✅ 禁用 view 權限的按鈕操作
      if (role === "view") {
        document.querySelectorAll('.primary').forEach(btn => {
          btn.disabled = true;
          btn.style.backgroundColor = "#ccc";
          btn.style.cursor = "not-allowed";
          btn.onclick = null;
          btn.title = "您沒有權限";
        });

        const notifyBtn = document.querySelector('button[onclick="openNotifyModal()"]');
        if (notifyBtn) {
          notifyBtn.disabled = true;
          notifyBtn.style.color = "#aaa";
          notifyBtn.style.cursor = "not-allowed";
          notifyBtn.onclick = null;
          notifyBtn.title = "您沒有權限";
        }
      }
    });


    function updateMemberRole(email, role) {
      const meetingId = "{{ meeting_id }}";
      fetch(`/api/meeting_members/${meetingId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, role })  // key 用 role
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            renderMembers();
          } else {
            alert(result.message || "更新失敗");
            renderMembers();
          }
        })
        .catch(err => {
          alert("發生錯誤，請稍後再試");
          renderMembers();
        });
    }

    function removeMember(email) {
      if (!confirm(`確定要刪除 ${email} 嗎？`)) return;
      const meetingId = "{{ meeting_id }}";

      fetch(`/api/meeting_members/${meetingId}`, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            renderMembers();  // 重新載入列表
          } else {
            alert(result.message || "刪除失敗");
          }
        })
        .catch(err => {
          alert("刪除發生錯誤");
          console.error("刪除錯誤：", err);
        });
    }

    function goToNext() {
      window.location.href = "{{ url_for('meeting_during_transcript_now_page', meeting_id=meeting_id) }}";
    }

    function openNotifyModal() {
      const modal = document.getElementById("notifyModal");
      modal.style.display = "flex"; // 顯示為彈出視窗（flex 中央對齊
      document.getElementById("notifyMeetingName").value = localStorage.getItem("currentMeetingName") || "未命名會議";
    }

    function closeNotifyModal() {
      const modal = document.getElementById("notifyModal");
      modal.style.display = "none"; // 隱藏
    }

    function loadOrganizationMembers() {
      const meetingId = "{{ meeting_id }}";
      const orgId = localStorage.getItem("currentOrgId");

      fetch(`/api/organization_members/${orgId}`)
        .then(res => res.json())
        .then(data => {
          if (!data.success) return;

          return fetch(`/api/meeting_members/${meetingId}`)
            .then(res => res.json())
            .then(meetingData => {
              const existingEmails = meetingData.members.map(m => m.email);
              const dropdown = document.getElementById("orgMemberDropdown");

              // 清空選單
              dropdown.innerHTML = "";

              // 篩掉已加入會議的人
              const remainingMembers = data.members.filter(m => !existingEmails.includes(m.email));

              if (remainingMembers.length === 0) {
                dropdown.innerHTML = `<option disabled selected>所有成員都已加入會議</option>`;
                dropdown.disabled = true;
              } else {
                remainingMembers.forEach(member => {
                  const option = document.createElement("option");
                  option.value = member.email;
                  option.textContent = member.email;
                  dropdown.appendChild(option);
                });
                dropdown.disabled = false;
              }
            });
        })
        .catch(err => {
          console.error("❌ 載入組織成員錯誤：", err);
        });
    }

    function addSelectedOrgMember() {
      const meetingId = "{{ meeting_id }}";
      const email = document.getElementById("orgMemberDropdown").value;
      const role = document.getElementById("orgMemberRole").value;

      if (!email) {
        alert("請選擇一位成員");
        return;
      }

      fetch(`/api/meeting_members/${meetingId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, role })
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            renderMembers();
            loadOrganizationMembers();  // 重新載入選單，移除已加入的成員
          } else {
            alert(result.message || "新增失敗");
          }
        });
    }
    function endMeeting() {
      const meetingId = "{{ meeting_id }}";
      if (!confirm("確定要結束會議嗎？")) return;

      // 先蒐集現有值（網址 / localStorage / window.MEETING / Jinja）
      const qs = new URLSearchParams(location.search);
      let orgId =
        qs.get("org_id") ||
        localStorage.getItem("current_org_id") ||
        (window.MEETING && window.MEETING.org_id) ||
        "{{ org_id }}" || "";

      let topicId =
        qs.get("topic_id") ||
        localStorage.getItem("current_topic_id") ||
        (window.MEETING && window.MEETING.topic_id) ||
        "{{ topic_id }}" || "";

      fetch(`/api/meeting/${meetingId}/end`, { method: "POST" })
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            alert("❌ " + (data.message || "結束會議失敗"));
            return;
          }

          // ✅ 優先使用後端回傳
          if (data.org_id) orgId = String(data.org_id);
          if (data.topic_id) topicId = String(data.topic_id);

          // 存起來以便其他頁使用
          if (orgId) localStorage.setItem("current_org_id", orgId);
          if (topicId) localStorage.setItem("current_topic_id", topicId);

          alert("✅ 會議已結束");

          // 有什麼帶什麼
          if (orgId && topicId) {
            location.href = `/meeting?org_id=${encodeURIComponent(orgId)}&topic_id=${encodeURIComponent(topicId)}`;
          } else if (orgId) {
            location.href = `/meeting?org_id=${encodeURIComponent(orgId)}`;
          } else {
            location.href = `/meeting`;
          }
        })
        .catch(err => {
          console.error("結束會議 API 錯誤", err);
          alert("⚠️ 系統錯誤");
        });
    }

  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
