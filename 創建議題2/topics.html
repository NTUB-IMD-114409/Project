<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會議寶｜創建議題</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar_b.css') }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .btn-primary {
            background-color: #205f72;
        }

        .btn-primary:hover {
            background-color: #175c71;
        }

        .org-card {
            background-color: #cedfe4;
            border-radius: 16px;
            padding: 12px 20px;
            width: calc(25% - 12px);
            height: 160px;
            position: relative;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card-hover-text {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.75);
            font-size: 16px;
            font-weight: bold;
            color: #205f72;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 5;
        }

        .org-card:hover .card-hover-text {
            opacity: 1;
        }

        .menu-button {
            position: absolute;
            top: 8px;
            right: 12px;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #205f72;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            /* 圓形 */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
        }

        .menu-button:hover,
        .menu-button:focus {
            background-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
            transform: scale(1.1);
            color: #103c47;
        }

        .menu-list button {
            white-space: nowrap;
            padding: 8px 16px;
            text-align: left;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: normal;
            font-size: 15px;
        }

        .menu-list button:hover {
            background-color: #f0f0f0;
        }

        #orgList {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 16px;
        }

        .dashed-box {
            border: 2px dashed #cedfe4;
            border-radius: 20px;
            background-color: #ffffff;
            padding: 24px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .menu-button {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .org-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-wrapper {
            position: absolute;
            top: 8px;
            right: 5px;
            width: 36px;
            height: 36px;
        }

        .menu-button:hover+.menu-list,
        .menu-list:hover {
            display: flex;
        }

        .menu-list {
            display: none;
            flex-direction: column;
            position: absolute;
            top: 36px;
            right: 0;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            z-index: 10;
            padding: 4px 0;
            min-width: 140px;
        }
    </style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <button class="navbar-toggle" onclick="toggleSidebar()" id="toggleBtn">
                <i data-lucide="align-justify" class="w-6 h-6 stroke-[#205f72]"></i>
            </button>
            <nav class="menu">
                <div class="sidebar-item cursor-default hover:bg-transparent select-none">
                    <i data-lucide="building" class="sidebar-icon stroke-[#205f72]"></i>
                    <div class="flex flex-col leading-snug">
                        <span class="text-xs text-gray-500">目前組織</span>
                        <span id="org-name" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
                    </div>
                </div>
                <a href="{{ url_for('organization.build_organization_page') }}"
                    class="sidebar-item flex items-center gap-2">
                    <i data-lucide="home" class="sidebar-icon"></i>
                    <span>首頁</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-2" onclick="goToTopicPage()">
                    <i data-lucide="swatch-book" class="sidebar-icon"></i>
                    <span>創建議題</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-2" onclick="openHelpModal()">
                    <i data-lucide="circle-question-mark" class="sidebar-icon"></i>
                    <span>使用說明</span>
                </a>
                <a href="{{ url_for('auth.signin_page') }}" class="sidebar-item flex items-center gap-2">
                    <i data-lucide="log-out" class="sidebar-icon"></i>
                    <span>登出</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <a href="{{ url_for('organization.build_organization_page') }}">
                        <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" class="logo-img" />
                    </a>
                </div>
                <div class="header-right">
                    <a id="avatarLink" href="#">
                        <img src="{{ url_for('static', filename='image/head.png') }}" alt="Head" class="avatar-img" />
                    </a>
                    </a>
                </div>
            </header>

            <section class="workspace px-10 py-8">
                <button onclick="openModal()" class="btn-primary text-white px-4 py-2 rounded-lg font-bold">＋
                    創建議題</button>

                <div class="mt-8 dashed-box text-center">
                    <h2 class="text-2xl font-bold text-[#205f72] mb-2">我的議題</h2>
                    <p id="meetingHint" class="text-gray-600">在此顯示你發起或參與的議題</p>
                    <div id="orgList" style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: flex-start;">
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black bg-opacity-50 z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
            <h3 class="text-xl font-bold text-[#205f72] mb-4 text-center">創建新議題</h3>
            <!-- 創建者 -->
            <div class="mb-4">
                <label class="block font-bold mb-1">創建者</label>
                <input id="topicCreator" type="text"
                    class="w-full p-3 rounded-lg border border-gray-300 bg-gray-100 text-gray-500 cursor-not-allowed pointer-events-none focus:outline-none focus:ring-0 focus:border-gray-300"
                    readonly>
            </div>
            <div class="mb-4">
                <label class="block font-bold mb-1">議題標題</label>
                <input id="topicTitle" type="text" placeholder="請輸入議題標題"
                    class="w-full p-3 rounded-lg border border-gray-300 focus:outline-none" />
            </div>
            <div class="mb-4">
                <label class="block font-bold mb-1">議題參與者</label>
                <div id="memberList" class="space-y-2 max-h-48 overflow-y-auto border p-3 rounded-lg bg-white">
                    <!-- 動態加入成員列表 -->
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-2">
                <button onclick="closeModal()" class="bg-gray-300 text-black px-4 py-2 rounded-lg">取消</button>
                <button onclick="createTopic()" class="btn-primary text-white px-4 py-2 rounded-lg">創建</button>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function openModal() {
            document.getElementById("modal").classList.remove("hidden");
            document.getElementById("modal").classList.add("flex");

            // ✅ 把登入頁存的 userName 顯示在創建者欄位
            const userName = localStorage.getItem("userName");
            document.getElementById("topicCreator").value = userName || "未登入使用者";
        }

        function closeModal() {
            document.getElementById("modal").classList.add("hidden");
            document.getElementById("modal").classList.remove("flex");
        }

        function createTopic() {
            const title = document.getElementById("topicTitle").value.trim();
            const creatorId = localStorage.getItem("user_id");  // ✅ 修正這行！
            const orgId = localStorage.getItem("currentOrgId");

            if (!title) {
                alert("請輸入議題標題！");
                return;
            }

            const participants = [];
            document.querySelectorAll(".member-checkbox").forEach(checkbox => {
                if (checkbox.checked) {
                    participants.push({
                        user_id: parseInt(checkbox.value)
                    });
                }
            });

            fetch("/api/topic", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    creator_id: parseInt(creatorId),
                    org_id: parseInt(orgId),
                    participants: participants
                })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert("議題創建成功！");
                        closeModal();
                        loadTopics();  // ✅ 重新讀取全部議題
                    }

                    else {
                        alert("創建失敗：" + data.message);
                    }
                })
                .catch(err => {
                    alert("發生錯誤：" + err);
                });
        }

        function openHelpModal() {
            alert("這是議題創建頁面，目前尚未設定使用說明內容。");
        }

        function getQueryParam(key) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(key);
        }

        document.addEventListener("DOMContentLoaded", function () {
            lucide.createIcons();
            const avatar = document.getElementById("avatarLink");

            // 🔄 先從網址取得 org_id
            let orgId = getQueryParam("org_id");
            if (!orgId) {
                console.warn("❌ 找不到 org_id 參數！");
                return;
            }

            // ✅ 儲存最新 org_id 到 localStorage
            localStorage.setItem("currentOrgId", orgId);

            // ✅ 確保 avatarLink 用的是最新 org_id
            avatar.href = `/organization_member/${orgId}`;

            // 載入組織成員
            fetch(`/api/organization_members/${orgId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && Array.isArray(data.members)) {
                        const memberList = document.getElementById("memberList");
                        memberList.innerHTML = "";

                        data.members.forEach(member => {
                            console.log("🟡 member.user_id:", member.user_id, "🟢 localStorage user_id:", localStorage.getItem("user_id"));
                            if (String(member.user_id) === localStorage.getItem("user_id")) return;


                            const row = document.createElement("div");
                            row.className = "flex items-center gap-3";

                            row.innerHTML = `
    <input type="checkbox" class="member-checkbox" value="${member.user_id}" />
    <span class="flex-1">${member.name} (${member.email})</span>
`;
                            memberList.appendChild(row);

                        });
                    }
                });

            // ✅ 載入議題卡片
            loadTopics();
        });

        function addTopicCard(title, description, topic_id) {
            const orgList = document.getElementById("orgList");

            const card = document.createElement("div");
            card.className = "org-card cursor-pointer";
            card.innerHTML = `
                <div class="menu-wrapper">
                    <button class="menu-button">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                    <div class="menu-list">
                        <button onclick="renameTopic(${topic_id}, '${title}')" data-id="${topic_id}">重新命名議題</button>
                        <button onclick="deleteTopic(this)" data-id="${topic_id}">刪除議題</button>
                    </div>
                </div>
                <div class="text-center">
                    <h3 class="text-lg font-bold text-[#205f72] mb-1">${title}</h3>
                    <p class="text-sm text-gray-700">${description}</p>
                </div>
            `;

            // ✅ 點擊整張卡片跳轉到 start_meeting 頁面，要帶 org_id
            card.addEventListener("click", function (event) {
                // 如果點的是三個點的 menu，就不要跳轉
                if (event.target.closest(".menu-wrapper")) return;
                const orgId = localStorage.getItem("currentOrgId"); // 抓 org_id
                window.location.href = `/meeting?topic_id=${topic_id}&org_id=${orgId}`;
            });
            orgList.appendChild(card);
        }
        document.addEventListener("DOMContentLoaded", function () {
            const orgName = localStorage.getItem("org_name");
            if (orgName) {
                const el = document.getElementById("org-name");
                if (el) el.textContent = orgName;
            }
        });
        function goToTopicPage() {
            const orgId = localStorage.getItem("currentOrgId");
            if (!orgId) {
                alert("⚠️ 尚未選擇組織，請先建立或切換組織！");
                return;
            }
            window.location.href = `/topics?org_id=${orgId}`;
        }

        function loadTopics() {
            const orgId = localStorage.getItem("currentOrgId");
            const orgList = document.getElementById("orgList");
            const hintText = document.getElementById("meetingHint");  // 🔸這行必須放在函式內部

            fetch(`/api/topic/by_org/${orgId}`)
                .then(res => {
                    if (!res.ok) {
                        return res.text().then(text => {
                            throw new Error("⚠️ 非 JSON 回應：" + text);
                        });
                    }
                    return res.json();
                })
                .then(data => {
                    orgList.innerHTML = ""; // 清空原本的卡片區

                    // ✅ 顯示/隱藏提示文字
                    if (data.topics.length > 0) {
                        hintText.style.display = "none";
                    } else {
                        hintText.style.display = "block";
                    }

                    data.topics.forEach(topic => {
                        addTopicCard(topic.title, topic.description || "", topic.id);
                    });
                })
                .catch(err => {
                    console.error("❌ 發生錯誤：", err);
                });
        }
        function deleteTopic(button) {
            const topicId = button.getAttribute("data-id");
            if (!topicId) return;

            if (!confirm("確定要刪除這個議題嗎？刪除後無法恢復。")) return;

            fetch(`/api/topic/${topicId}`, {
                method: "DELETE"
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert("✅ 議題已刪除！");
                        loadTopics(); // 重新載入列表
                    } else {
                        alert("❌ 刪除失敗：" + data.message);
                    }
                })
                .catch(err => {
                    alert("❌ 發生錯誤：" + err);
                });
        }
        function renameTopic(topicId, oldTitle) {
            const newTitle = prompt("請輸入新的議題標題：", oldTitle);
            if (!newTitle || newTitle.trim() === "") {
                alert("⚠️ 標題不可為空！");
                return;
            }

            fetch(`/api/topic/${topicId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ title: newTitle.trim() })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        alert("✅ 議題標題已更新！");
                        loadTopics(); // 重新載入卡片
                    } else {
                        alert("❌ 更新失敗：" + data.message);
                    }
                })
                .catch(err => {
                    alert("❌ 發生錯誤：" + err);
                });
        }

    </script>
</body>

</html>
