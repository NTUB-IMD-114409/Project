<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會議寶｜會議中｜即時轉錄</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar_d.css') }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .main-wrapper {
            height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 20px 16px;
        }

        .btn-primary {
            background-color: #205f72;
        }

        .btn-primary:hover {
            background-color: #175c71;
        }

        .status-start,
        .status-stop {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-top: 12px;
        }

        .status-start {
            color: #205f72;
        }

        .status-stop {
            color: #d8392b;
        }

        .dashed-box {
            border: 2px dashed #cedfe4;
            border-radius: 20px;
            background: #fff;
            padding: 24px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, .08);
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        /* 編輯模式下的可編輯樣式 */
        .editable[contenteditable="true"] {
            outline: 2px dashed #cedfe4;
            border-radius: .5rem;
            padding: .25rem .5rem;
            background: #fcfeff;
        }

        .editable[contenteditable="true"]:focus {
            outline-color: #205f72;
            background: #f3fafc;
        }

        /* 美化捲動條 */
        #liveText::-webkit-scrollbar {
            width: 10px;
        }

        #liveText::-webkit-scrollbar-thumb {
            background: #cedfe4;
            border-radius: 8px;
        }

        #liveText {
            scrollbar-width: thin;
            scrollbar-color: #cedfe4 transparent;
        }
    </style>
</head>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <button class="navbar-toggle" onclick="toggleSidebar()" id="toggleBtn">
                <i data-lucide="align-justify" class="w-6 h-6 stroke-[#205f72]"></i>
            </button>
            <nav class="menu">
                <div class="sidebar-item cursor-default hover:bg-transparent select-none">
                    <i data-lucide="building" class="sidebar-icon stroke-[#205f72]"></i>
                    <div class="flex flex-col leading-snug">
                        <span class="text-xs text-gray-500">目前會議</span>
                        <span id="meeting-date"
                            class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
                        <span id="meeting-name"
                            class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
                    </div>
                </div>
                <a href="{{ url_for('file.meeting_during_file_upload_page', meeting_id=meeting_id) }}"
                    class="sidebar-item">
                    <i data-lucide="file-plus" class="sidebar-icon"></i><span>檔案上傳</span>
                </a>
                <a href="{{ url_for('meeting_during_transcript_now_page', meeting_id=meeting_id) }}"
                    class="sidebar-item">
                    <i data-lucide="mic" class="sidebar-icon"></i><span>語音轉文字</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-2" onclick="openHelpModal()">
                    <i data-lucide="circle-question-mark" class="sidebar-icon"></i>
                    <span>使用說明</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <a href="{{ url_for('organization.build_organization_page') }}">
                        <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" class="logo-img" />
                    </a>
                </div>
                <div class="progress-bar flex items-center">
                    <div class="step-group">
                        <div class="circle gray-completed"></div>
                        <div class="label label-gray">前</div>
                    </div>
                    <div class="line solid-gray"></div>
                    <div class="step-group">
                        <div class="circle completed"></div>
                        <div class="label">中</div>
                    </div>
                    <div class="line dashed relative flex-1 flex items-center justify-center">
                        <button onclick="goToNext()"
                            class="absolute z-10 bg-[#175c71] text-white text-sm px-3 py-1 rounded-full hover:bg-[#124654] transition-all">下一步</button>
                    </div>
                    <div class="step-group">
                        <div class="circle"></div>
                        <div class="label">後</div>
                    </div>
                </div>
                <div class="header-right">
                    <a href="{{ url_for('permission.meeting_member2_page', meeting_id=meeting_id) }}">
                        <img src="{{ url_for('static', filename='image/head.png') }}" alt="Head" class="avatar-img" />
                    </a>
                </div>
            </header>

            <div class="main-wrapper">
                <section class="flex justify-center px-4">
                    <div class="w-full max-w-4xl dashed-box relative">
                        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                            <div id="statusContainer" class="text-xl font-bold">請開始錄音</div>
                        </div>

                        <!-- 逐字區：固定高度、可捲動 -->
                        <div id="liveText"
                            class="h-[58vh] text-base text-gray-800 space-y-2 overflow-y-auto flex-1 border border-gray-200 rounded-lg p-3 overscroll-contain scroll-smooth">
                        </div>
                        <!-- 跳到最新 -->
                        <button id="jumpLatestBtn"
                            class="hidden absolute bottom-4 right-4 bg-[#205f72] hover:bg-[#124654] text-white text-sm px-3 py-2 rounded-lg shadow">
                            跳到最新
                        </button>
                    </div>
                </section>

                <div class="flex flex-col items-center gap-4 mt-6 pb-6">
                    <div class="flex flex-wrap justify-center items-center gap-3">
                        <button id="startBtn"
                            class="btn-primary text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2">
                            <i data-lucide="play" class="w-5 h-5"></i> 開始
                        </button>
                        <button id="pauseBtn"
                            class="btn-primary text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2"
                            disabled>
                            <i data-lucide="pause" class="w-5 h-5"></i> 暫停
                        </button>
                        <button id="stopBtn"
                            class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2"
                            disabled>
                            <i data-lucide="square" class="w-5 h-5"></i> 停止
                        </button>
                    </div>
                    <button id="downloadBtn"
                        class="hidden bg-[#205f72] text-white px-4 py-2 rounded-lg font-semibold hover:bg-[#124654] transition">
                        📄 下載逐字稿
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Safari WAV 相容 -->
    <script src="https://cdn.jsdelivr.net/gh/mattdiamond/Recorderjs@master/dist/recorder.js"></script>

    <script>

        window.addEventListener("load", () => {
            const startBtn = document.getElementById("startBtn");
            const stopBtn = document.getElementById("stopBtn");
            const pauseBtn = document.getElementById("pauseBtn");
            const liveTextEl = document.getElementById("liveText");
            const statusContainer = document.getElementById("statusContainer");
            const wsStateEl = document.getElementById("wsState");

            let ws;
            let isRecording = false;

            // WebM
            let mediaRecorder, mediaStream;
            // WAV fallback
            let audioCtx, inputNode, wavRecorder, wavTimer;

            function setStatus(msg, type) {
                statusContainer.innerHTML = `<div class="${type === "start" ? "status-start" : "status-stop"}">${msg}</div>`;
            }

            function appendBlock(text, isFinal = false) {
                const block = document.createElement("div");
                block.className = "rounded p-3 bg-white shadow-sm mb-2 text-[#205f72] text-base font-medium";
                block.textContent = text;
                if (isFinal) block.style.background = "#eefbf6";
                liveTextEl.appendChild(block);
                liveTextEl.scrollTop = liveTextEl.scrollHeight;
            }

            function appendEditableLine(speaker, content) {
                const div = document.createElement("div");
                div.className = "rounded p-3 bg-white shadow-sm mb-2 text-[#205f72] text-base font-medium bg-[#eefbf6] flex flex-wrap items-start gap-2";

                // 可編輯說話者名稱
                const spk = document.createElement("span");
                spk.contentEditable = true;
                spk.className = "editable font-semibold";
                spk.textContent = speaker;
                spk.title = "點擊可編輯說話者";

                const text = document.createElement("span");
                text.textContent = content;

                div.appendChild(spk);
                div.appendChild(document.createTextNode("："));
                div.appendChild(text);
                liveTextEl.appendChild(div);
                liveTextEl.scrollTop = liveTextEl.scrollHeight;
            }

            function pickBestMime() {
                const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
                if (!window.MediaRecorder) return "";
                for (const c of candidates) {
                    if (MediaRecorder.isTypeSupported(c)) return c;
                }
                return "";
            }

            async function startRecording() {
                try {
                    liveTextEl.innerHTML = ""; // ✅ 開始錄音時清空舊逐字稿
                    setStatus("🎤 準備錄音中...", "start");

                    ws = new WebSocket(`ws://${location.host}/ws/transcribe`);
                    ws.onopen = () => {
                        wsStateEl.textContent = "WebSocket：已連線";
                        console.log("✅ WS opened");
                    };
                    ws.onclose = () => {
                        wsStateEl.textContent = "WebSocket：已關閉";
                        console.log("❌ WS closed");
                    };

                    ws.onmessage = (evt) => {
                        try {
                            const msg = JSON.parse(evt.data);
                            if (msg.type === "partial") {
                                appendBlock(msg.text);
                            } else if (msg.type === "full") {
                                liveTextEl.innerHTML = ""; // ✅ AI潤飾稿出來時覆蓋
                                if (msg.segments.length > 0 && msg.segments[0].speaker === "AI潤飾稿") {
                                    // AI潤飾稿：分行顯示 & 可編輯說話者
                                    const lines = msg.segments[0].text
                                        .split(/\n+/)
                                        .filter(line => line.trim().length > 0);
                                    lines.forEach(line => {
                                        const match = line.match(/^(.+?)：(.+)$/);
                                        if (match) {
                                            appendEditableLine(match[1].trim(), match[2].trim());
                                        } else {
                                            appendEditableLine("說話者", line.trim());
                                        }
                                    });
                                } else {
                                    msg.segments.forEach(seg => appendEditableLine(seg.speaker, seg.text));
                                }
                            }
                        } catch (e) {
                            console.error("WS message parse error:", e);
                        }
                    };

                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

                    const mimeType = pickBestMime();
                    if (mimeType) {
                        mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
                        mediaRecorder.ondataavailable = (event) => {
                            if (event.data && event.data.size > 0 && isRecording && ws && ws.readyState === WebSocket.OPEN) {
                                event.data.arrayBuffer().then(buf => ws.send(buf));
                            }
                        };
                        mediaRecorder.start(2000);
                        setStatus("🎤 錄音中（WebM/Opus）", "start");
                    } else {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        inputNode = audioCtx.createMediaStreamSource(mediaStream);
                        wavRecorder = new Recorder(inputNode, { numChannels: 1 });
                        wavRecorder.record();
                        wavTimer = setInterval(() => {
                            wavRecorder.exportWAV(async (blob) => {
                                if (ws && ws.readyState === WebSocket.OPEN) ws.send(await blob.arrayBuffer());
                                wavRecorder.clear();
                            });
                        }, 2000);
                        setStatus("🎤 錄音中（WAV 相容模式）", "start");
                    }

                    isRecording = true;
                    startBtn.disabled = true;
                    pauseBtn.disabled = false;
                    stopBtn.disabled = false;
                } catch (err) {
                    console.error("錄音錯誤:", err);
                    setStatus("❌ 錄音啟動失敗", "stop");
                }
            }

            function stopRecording() {
                isRecording = false;
                try { if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop(); } catch { }
                try { if (mediaStream) mediaStream.getTracks().forEach(t => t.stop()); } catch { }
                try { if (wavTimer) clearInterval(wavTimer); if (wavRecorder) wavRecorder.stop(); if (audioCtx) audioCtx.close(); } catch { }
                if (ws && ws.readyState === WebSocket.OPEN) ws.send("STOP");
                setStatus("⏹️ 已停止", "stop");
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                stopBtn.disabled = true;
            }

            function pauseOrResume() {
                if (mediaRecorder && mediaRecorder.state) {
                    if (mediaRecorder.state === "recording") {
                        mediaRecorder.pause();
                        setStatus("⏸️ 已暫停錄音", "stop");
                        pauseBtn.innerHTML = `<i data-lucide="play" class="w-5 h-5"></i> 繼續`;
                    } else if (mediaRecorder.state === "paused") {
                        mediaRecorder.resume();
                        setStatus("🎤 錄音中（WebM/Opus）", "start");
                        pauseBtn.innerHTML = `<i data-lucide="pause" class="w-5 h-5"></i> 暫停`;
                    }
                }
                lucide.createIcons();
            }

            startBtn.addEventListener("click", startRecording);
            stopBtn.addEventListener("click", stopRecording);
            pauseBtn.addEventListener("click", pauseOrResume);
            lucide.createIcons();
        });

        function goToNext() {
            window.location.href = "{{ url_for('permission.meeting_review_page', meeting_id=meeting_id) }}";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const name = localStorage.getItem("currentMeetingName") || "未命名會議";
            const date = localStorage.getItem("currentMeetingDate") || "未指定日期";

            document.getElementById("meeting-name").textContent = name;
            document.getElementById("meeting-date").textContent = date;
        });

        function openHelpModal() {
            document.getElementById("helpModal").classList.remove("hidden");
            document.getElementById("helpModal").classList.add("flex");
        }


        function closeHelpModal() {
            document.getElementById("helpModal").classList.add("hidden");
            document.getElementById("helpModal").classList.remove("flex");
        }

    </script>

    <!-- 使用說明 Modal -->
    <div id="helpModal" class="fixed inset-0 hidden items-center justify-center bg-black bg-opacity-50 z-50">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg flex flex-col overflow-hidden">
            <div class="p-6 flex-1 overflow-y-auto max-h-[80vh]">
                <h3 class="text-xl font-bold text-[#205f72] mb-4 text-center">使用說明</h3>
                <ol class="list-decimal pl-5 text-gray-700 leading-relaxed text-base space-y-3">
                    <li><span class="font-semibold text-[#205f72]">開始錄音</span>
                        <ul class="list-disc pl-6 mt-1 space-y-1">
                            <li>點擊「開始」後系統會啟用麥克風，並即時上傳音訊片段。</li>
                            <li>錄音進行中，轉譯結果會自動顯示在逐字稿區。</li>
                        </ul>
                    </li>
                    <li><span class="font-semibold text-[#205f72]">暫停與繼續</span>
                        <ul class="list-disc pl-6 mt-1 space-y-1">
                            <li>點擊「暫停」可暫停錄音。</li>
                            <li>再次點擊即可繼續錄音。</li>
                        </ul>
                    </li>
                    <li><span class="font-semibold text-[#205f72]">停止錄音</span>
                        <ul class="list-disc pl-6 mt-1 space-y-1">
                            <li>點擊「停止」後會結束錄音。</li>
                            <li>可下載或上傳逐字稿。</li>
                        </ul>
                    </li>
                    <li>
                        <span class="font-semibold text-[#205f72]">流程進度</span>
                        <ul class="list-disc pl-6 mt-1 space-y-1">
                            <li>頁面上方進度條顯示「前 / 中 / 後」三個階段。</li>
                            <li>
                                點擊 <span class="bg-[#175c71] text-white text-xs px-2 py-0.5 rounded">下一步</span>
                                進入會議後階段。
                            </li>
                        </ul>
                    </li>
                </ol>
            </div>
            <div class="flex justify-center p-4 border-t">
                <button onclick="closeHelpModal()" class="bg-gray-300 text-black px-6 py-2 rounded-lg">關閉</button>
            </div>
        </div>
    </div>

</body>

</html>
