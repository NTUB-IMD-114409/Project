<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會議寶｜會議中｜即時轉錄</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar_d.css') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/opencc-js@1.0.5/dist/umd/full.min.js"></script>
  <style>
    .main-wrapper {
      height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 20px 16px
    }

    .btn-primary {
      background-color: #205f72
    }

    .btn-primary:hover {
      background-color: #175c71
    }

    .status-start,
    .status-stop {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      margin-top: 12px
    }

    .status-start {
      color: #205f72
    }

    .status-stop {
      color: #d8392b
    }

    .dashed-box {
      border: 2px dashed #cedfe4;
      border-radius: 20px;
      background: #fff;
      padding: 24px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, .08);
      min-height: 420px;
      display: flex;
      flex-direction: column
    }

    .seg {
      border: 1px solid #e5eef1;
      border-radius: 14px;
      background: #fff;
      padding: 12px 12px 10px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .05)
    }

    .seg-head {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      color: #4b5563;
      font-size: 12px;
      margin-bottom: 6px
    }

    .seg-time {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #f2f7f9;
      border-radius: 8px;
      padding: 2px 8px
    }

    .seg-body {
      color: #205f72;
      font-size: 16px;
      font-weight: 500
    }

    .seg-body[contenteditable="true"] {
      outline: 2px dashed #cedfe4;
      border-radius: .5rem;
      padding: .25rem .5rem;
      background: #fcfeff
    }

    .seg-body[contenteditable="true"]:focus {
      outline-color: #205f72;
      background: #f3fafc
    }

    #liveText::-webkit-scrollbar {
      width: 10px
    }

    #liveText::-webkit-scrollbar-thumb {
      background: #cedfe4;
      border-radius: 8px
    }

    #liveText {
      scrollbar-width: thin;
      scrollbar-color: #cedfe4 transparent
    }

    /* 小圈圈 loading 動畫 */
    .spinner {
      border: 3px solid #e5eef1;
      border-top: 3px solid #205f72;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="navbar-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')"
        id="toggleBtn">
        <i data-lucide="align-justify" class="w-6 h-6 stroke-[#205f72]"></i>
      </button>
      <nav class="menu">
        <div class="sidebar-item cursor-default hover:bg-transparent select-none">
          <i data-lucide="building" class="sidebar-icon stroke-[#205f72]"></i>
          <div class="flex flex-col leading-snug">
            <span class="text-xs text-gray-500">目前會議</span>
            <span id="meeting-date" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
            <span id="meeting-name" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
          </div>
        </div>
        <a href="{{ url_for('file.meeting_during_file_upload_page', meeting_id=meeting_id) }}" class="sidebar-item">
          <i data-lucide="file-plus" class="sidebar-icon"></i><span>檔案上傳</span>
        </a>
        <a href="{{ url_for('meeting_during_transcript_now_page', meeting_id=meeting_id) }}" class="sidebar-item">
          <i data-lucide="mic" class="sidebar-icon"></i><span>語音轉文字</span>
        </a>
        <a href="#" class="sidebar-item flex items-center gap-2" onclick="openHelpModal()">
          <i data-lucide="circle-question-mark" class="sidebar-icon"></i><span>使用說明</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <a href="{{ url_for('organization.build_organization_page') }}">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" class="logo-img" />
          </a>
        </div>
        <div class="progress-bar flex items-center">
          <div class="step-group">
            <div class="circle gray-completed"></div>
            <div class="label label-gray">前</div>
          </div>
          <div class="line solid-gray"></div>
          <div class="step-group">
            <div class="circle completed"></div>
            <div class="label">中</div>
          </div>
          <div class="line dashed relative flex-1 flex items-center justify-center">
            <button onclick="goToNext()"
              class="absolute z-10 bg-[#175c71] text-white text-sm px-3 py-1 rounded-full hover:bg-[#124654] transition-all">下一步</button>
          </div>
          <div class="step-group">
            <div class="circle"></div>
            <div class="label">後</div>
          </div>
        </div>
        <div class="header-right">
          <a href="{{ url_for('permission.meeting_member2_page', meeting_id=meeting_id) }}">
            <img src="{{ url_for('static', filename='image/head.png') }}" alt="Head" class="avatar-img" />
          </a>
        </div>
      </header>

      <div class="main-wrapper">
        <section class="flex justify-center px-4">
          <div class="w-full max-w-4xl dashed-box relative">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
              <div id="statusContainer" class="text-xl font-bold">請開始錄音</div>
              <div class="flex flex-wrap items-center gap-3 text-sm">
                <label class="text-gray-600">切片秒數：</label>
                <select id="slice" class="border rounded-md px-2 py-1">
                  <option selected>1</option>
                  <option>2</option>
                  <option>3</option>
                  <option>5</option>
                </select>
                <label class="inline-flex items-center gap-1"><input id="editModeChk" type="checkbox"
                    class="accent-[#205f72]"><span>編輯模式</span></label>
                <label class="inline-flex items-center gap-1"><input id="autoScrollChk" type="checkbox" checked
                    class="accent-[#205f72]"><span>自動捲動</span></label>
              </div>
            </div>

            <div id="liveText"
              class="h-[58vh] text-base text-gray-800 space-y-2 overflow-y-auto flex-1 border border-gray-200 rounded-lg p-3 overscroll-contain scroll-smooth">
            </div>
            <button id="jumpLatestBtn"
              class="hidden absolute bottom-4 right-4 bg-[#205f72] hover:bg-[#124654] text-white text-sm px-3 py-2 rounded-lg shadow">跳到最新</button>
          </div>
        </section>

        <div class="flex flex-col items-center gap-4 mt-6 pb-6">
          <div class="flex flex-wrap justify-center items-center gap-3">
            <button id="startBtn"
              class="btn-primary text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2">
              <i data-lucide="play" class="w-5 h-5"></i> 開始</button>
            <button id="pauseBtn"
              class="btn-primary text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2" disabled>
              <i data-lucide="pause" class="w-5 h-5"></i> 暫停</button>
            <button id="stopBtn"
              class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2"
              disabled>
              <i data-lucide="square" class="w-5 h-5"></i> 停止</button>
          </div>
          <div class="flex flex-wrap gap-3">
            <button id="downloadBtn"
              class="hidden bg-[#205f72] text-white px-4 py-2 rounded-lg font-semibold hover:bg-[#124654] transition">📄下載逐字稿</button>
            <button id="uploadBtn"
              class="hidden bg-emerald-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-emerald-700 transition">☁️上傳至檔案區</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    function openHelpModal() {
      document.getElementById("helpModal").classList.remove("hidden");
      document.getElementById("helpModal").classList.add("flex");
    }

    function closeHelpModal() {
      document.getElementById("helpModal").classList.add("hidden");
      document.getElementById("helpModal").classList.remove("flex");
    }

    function goToNext() {
      window.location.href = "{{ url_for('permission.meeting_review_page', meeting_id=meeting_id) }}";
    }

    window.addEventListener("load", () => {
      const MEETING_ID = "{{ meeting_id }}";
      const startBtn = document.getElementById("startBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const stopBtn = document.getElementById("stopBtn");
      const downloadBtn = document.getElementById("downloadBtn");
      const uploadBtn = document.getElementById("uploadBtn");
      const statusContainer = document.getElementById("statusContainer");
      const liveTextEl = document.getElementById("liveText");
      const autoScrollChk = document.getElementById("autoScrollChk");
      const jumpLatestBtn = document.getElementById("jumpLatestBtn");
      const editModeChk = document.getElementById("editModeChk");
      const sliceSel = document.getElementById("slice");

      const toTW = (window.OpenCC && OpenCC.Converter) ? OpenCC.Converter({ from: 'cn', to: 'tw' }) : (s => s);

      let mediaRecorder = null, mediaStream = null;
      let paused = false, timelineSec = 0, fullTranscript = "";

      function setStatus(msg, type) {
        statusContainer.innerHTML = `<div class="${type === "start" ? "status-start" : "status-stop"}">${msg}</div>`;
      }

      function srtTime(sec) {
        const ms = Math.round((sec - Math.floor(sec)) * 1000);
        const s = Math.floor(sec % 60); const m = Math.floor((sec / 60) % 60);
        const h = Math.floor(sec / 3600); const pad = (n, w = 2) => String(n).padStart(w, "0");
        return `${pad(h)}:${pad(m)}:${pad(s)},${pad(ms, 3)}`;
      }
      function fmtTimeRange(a, b) { return `${srtTime(a)} --> ${srtTime(b)}`; }

      document.getElementById("meeting-name").textContent = localStorage.getItem("currentMeetingName") || "未命名會議";
      document.getElementById("meeting-date").textContent = localStorage.getItem("currentMeetingDate") || "未指定日期";

      function createSeg(startSec, endSec, text) {
        const seg = document.createElement("div"); seg.className = "seg";
        const head = document.createElement("div"); head.className = "seg-head";
        const timeEl = document.createElement("span"); timeEl.className = "seg-time"; timeEl.textContent = fmtTimeRange(startSec, endSec);
        const body = document.createElement("div"); body.className = "seg-body"; body.textContent = text;
        body.contentEditable = editModeChk.checked ? "true" : "false";
        head.appendChild(timeEl); seg.appendChild(head); seg.appendChild(body);
        return seg;
      }

      function appendSegment(text, durSec) {
        if (!text) return;
        try { text = toTW ? toTW(text) : text; } catch { }
        const start = timelineSec, end = start + (durSec || 0);
        const seg = createSeg(start, end, text);
        liveTextEl.appendChild(seg);
        fullTranscript += (fullTranscript ? "\n" : "") + text;
        timelineSec = end;

        const nearBottom = liveTextEl.scrollTop + liveTextEl.clientHeight >= liveTextEl.scrollHeight - 60;
        if (autoScrollChk.checked || nearBottom) {
          liveTextEl.scrollTop = liveTextEl.scrollHeight;
          jumpLatestBtn.classList.add("hidden");
        }
      }

      async function sendChunk(blob, durSec) {
        const fd = new FormData();
        fd.append("audio", blob, "chunk.webm");

        // 🔹 在逐字稿區先放一個「處理中」段落
        const start = timelineSec, end = start + durSec;
        const seg = createSeg(start, end, "");
        seg.classList.add("pending");

        const placeholder = seg.querySelector(".seg-body");
        placeholder.innerHTML = `<span class="spinner"></span>處理中...`;

        liveTextEl.appendChild(seg);

        try {
          const res = await fetch("/chunk/upload_audio", { method: "POST", body: fd });
          const data = await res.json();

          if (data.transcript) {
            let text = data.transcript;
            try { text = toTW ? toTW(text) : text; } catch { }
            placeholder.textContent = text;
            seg.classList.remove("pending");
            fullTranscript += (fullTranscript ? "\n" : "") + text;
            timelineSec = end;
          } else {
            placeholder.textContent = "❌ 轉錄失敗";
          }
        } catch (e) {
          placeholder.textContent = "⚠️ 網路錯誤";
          console.error("網路錯誤:", e);
        }

        // 🔹 自動捲動控制
        const nearBottom = liveTextEl.scrollTop + liveTextEl.clientHeight >= liveTextEl.scrollHeight - 60;
        if (autoScrollChk.checked || nearBottom) {
          liveTextEl.scrollTop = liveTextEl.scrollHeight;
          jumpLatestBtn.classList.add("hidden");
        }
      }

      async function start() {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          setStatus("❌ 無法啟用麥克風：" + e.message, "stop");
          return;
        }

        const sliceMs = parseInt(sliceSel.value, 10) * 1000;
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm" });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0 && !paused) {
            const durSec = sliceMs / 1000;
            sendChunk(e.data, durSec);
          }
        };

        mediaRecorder.start(sliceMs);

        startBtn.disabled = true;
        pauseBtn.disabled = false;
        stopBtn.disabled = false;
        liveTextEl.textContent = "";
        fullTranscript = "";
        paused = false;
        timelineSec = 0;
        setStatus("🎤 錄音中（REST chunk 模式）", "start");
      }

      function pauseOrResume() {
        paused = !paused;
        setStatus(paused ? "⏸️ 已暫停錄音" : "🎤 錄音中", paused ? "stop" : "start");
      }

      function stopAll() {
        try { mediaRecorder && mediaRecorder.stop(); } catch { }
        try { mediaStream && mediaStream.getTracks().forEach(t => t.stop()); } catch { }
        startBtn.disabled = false; pauseBtn.disabled = true; stopBtn.disabled = true;
        downloadBtn.classList.remove("hidden"); uploadBtn.classList.remove("hidden");
        setStatus("⏹️ 錄音已結束", "stop");
      }

      function downloadTxt() {
        if (!fullTranscript.trim()) { setStatus("⚠️ 沒有可下載的內容", "stop"); return; }
        const blob = new Blob([fullTranscript], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = "transcript.txt"; a.click();
        URL.revokeObjectURL(url);
      }

      async function uploadTranscript() {
        if (!fullTranscript.trim()) { setStatus("⚠️ 沒有可上傳的內容", "stop"); return; }
        const fname = `transcript_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-")}.txt`;
        const fd = new FormData();
        fd.append("meeting_id", MEETING_ID);
        fd.append("filename", fname);
        fd.append("file", new Blob([fullTranscript], { type: "text/plain;charset=utf-8" }), fname);
        try {
          const res = await fetch("/api/files/transcript", { method: "POST", body: fd });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data && data.ok) {
            setStatus("✅ 已上傳至檔案區", "start");
            setTimeout(() => { window.location.href = "{{ url_for('file.meeting_during_file_upload_page', meeting_id=meeting_id) }}"; }, 800);
          } else { throw new Error((data && data.error) || "upload_failed"); }
        } catch (e) { setStatus("❌ 上傳失敗：" + (e.message || e), "stop"); }
      }

      startBtn.addEventListener("click", start);
      pauseBtn.addEventListener("click", pauseOrResume);
      stopBtn.addEventListener("click", stopAll);
      downloadBtn.addEventListener("click", downloadTxt);
      uploadBtn.addEventListener("click", uploadTranscript);
      lucide.createIcons();
    });
  </script>


  <!-- 使用說明 Modal -->
  <div id="helpModal" class="fixed inset-0 hidden items-center justify-center bg-black bg-opacity-50 z-50">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg flex flex-col overflow-hidden">
      <div class="p-6 flex-1 overflow-y-auto max-h-[80vh]">
        <h3 class="text-xl font-bold text-[#205f72] mb-4 text-center">使用說明</h3>
        <ol class="list-decimal pl-5 text-gray-700 leading-relaxed text-base space-y-3">
          <li><span class="font-semibold text-[#205f72]">開始錄音</span>
            <ul class="list-disc pl-6 mt-1 space-y-1">
              <li>點擊「開始」後系統會啟用麥克風，並即時上傳音訊片段。</li>
              <li>錄音進行中，轉譯結果會自動顯示在逐字稿區。</li>
            </ul>
          </li>
          <li><span class="font-semibold text-[#205f72]">暫停與繼續</span>
            <ul class="list-disc pl-6 mt-1 space-y-1">
              <li>點擊「暫停」可暫停錄音。</li>
              <li>再次點擊即可繼續錄音。</li>
            </ul>
          </li>
          <li><span class="font-semibold text-[#205f72]">停止錄音</span>
            <ul class="list-disc pl-6 mt-1 space-y-1">
              <li>點擊「停止」後會結束錄音。</li>
              <li>可下載或上傳逐字稿。</li>
            </ul>
          </li>
        </ol>
      </div>
      <div class="flex justify-center p-4 border-t">
        <button onclick="closeHelpModal()" class="bg-gray-300 text-black px-6 py-2 rounded-lg">關閉</button>
      </div>
    </div>
  </div>
</body>

</html>
