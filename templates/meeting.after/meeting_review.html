<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會議寶｜會議後｜會議回顧</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar_a.css') }}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f5f8fa;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
        }

        .main-wrapper {
            height: calc(100vh - 100px);
            overflow-y: auto;
            padding: 20px 16px;
        }

        .dashed-box {
            border: 2px dashed #cedfe4;
            border-radius: 20px;
            background-color: #ffffff;
            padding: 24px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .btn-primary {
            background-color: #205f72;
        }

        .btn-primary:hover {
            background-color: #175c71;
        }

        button[title] {
            transition: background-color 0.2s ease;
        }

        select {
            appearance: none;
        }

        textarea {
            resize: none;
        }

        .bg-green-500 {
            background-color: #48bb78;
        }

        .disabled-edit-btn {
            color: #AAA !important;
            cursor: not-allowed !important;
            /* 刪除 pointer-events: none; */
        }

        .disabled-edit-btn svg {
            stroke: #AAA !important;
        }
    </style>
</head>

<body>
    <script>
        window.PERMISSION = "{{ role }}";
        window.TOPIC_ID = "{{ topic_id }}";
    </script>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <button class="navbar-toggle" onclick="toggleSidebar()" id="toggleBtn">
                <i data-lucide="align-justify" class="w-6 h-6 stroke-[#205f72]"></i>
            </button>
            <nav class="menu">
                <!-- ...sidebar內容... -->
                <div class="sidebar-item cursor-default hover:bg-transparent select-none">
                    <i data-lucide="building" class="sidebar-icon stroke-[#205f72]"></i>
                    <div class="flex flex-col leading-snug">
                        <span class="text-xs text-gray-500">目前會議</span>
                        <span id="meeting-date"
                            class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
                        <span id="meeting-name"
                            class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
                    </div>
                </div>

                <a href="{{ url_for('file.meeting_after_file_upload_page', meeting_id=meeting_id) }}"
                    class="sidebar-item"><i data-lucide="file-plus" class="sidebar-icon"></i><span>檔案上傳</span></a>
                <a href="{{ url_for('transcript_file_page', meeting_id=meeting_id) }}" class="sidebar-item"><i
                        data-lucide="mic" class="sidebar-icon"></i><span>語音轉文字</span></a>
                <a href="{{ url_for('permission.meeting_review_page', meeting_id=meeting_id) }}" class="sidebar-item"><i
                        data-lucide="folder-search-2" class="sidebar-icon"></i><span>會議回顧</span></a>
                <a href="{{ url_for('qa.meeting_qa_history', meeting_id=meeting_id) }}" class="sidebar-item">
                    <i data-lucide="search" class="sidebar-icon"></i>查詢紀錄
                </a>
                <a href="{{ url_for('meeting_formal_doc_page', meeting_id=meeting_id) }}" class="sidebar-item"><i
                        data-lucide="file-text" class="sidebar-icon"></i><span>正式文件</span></a>
                <a href="#" class="sidebar-item flex items-center gap-2" onclick="openHelpModal()">
                    <i data-lucide="list-todo" class="sidebar-icon"></i>
                    <span>任務追蹤</span>
                </a>
                <a href="#" class="sidebar-item flex items-center gap-2" onclick="openHelpModal()">
                    <i data-lucide="circle-question-mark" class="sidebar-icon"></i>
                    <span>使用說明</span>
                </a>
                <a href="{{ url_for('auth.signin_page') }}" class="sidebar-item"><i data-lucide="log-out"
                        class="sidebar-icon"></i><span>登出</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <a href="{{ url_for('organization.build_organization_page') }}">
                        <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" class="logo-img" />
                    </a>
                </div>
                <div class="progress-bar">
                    <div class="step-group">
                        <div class="circle gray-completed"></div>
                        <div class="label label-gray">前</div>
                    </div>
                    <div class="line solid-gray"></div>
                    <div class="step-group">
                        <div class="circle gray-completed"></div>
                        <div class="label label-gray">中</div>
                    </div>
                    <div class="line solid-gray"></div>
                    <div class="step-group">
                        <div class="circle green-completed"></div>
                        <div class="label label-green">後</div>
                    </div>
                </div>
                <div class="header-right">
                    <a href="{{ url_for('permission.meeting_member3_page', meeting_id=meeting_id) }}">
                        <img src="{{ url_for('static', filename='image/head.png') }}" alt="Head" class="avatar-img" />
                    </a>
                </div>
            </header>

            <div class="main-wrapper">
                <section class="flex justify-center px-4">
                    <div class="w-full max-w-4xl space-y-6">
                        <div class="dashed-box">
                            <h2 class="text-2xl font-bold text-[#205f72] mb-6 text-center w-full">會議摘要</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                <div class="flex-1">
                                    <label for="meetingTitle"
                                        class="block mb-1 text-[#205f72] font-semibold">選擇會議</label>
                                    <select id="meetingTitle"
                                        class="w-full px-5 py-3 bg-white border border-[#cedfe4] text-black rounded-lg">
                                        <option value="">請選擇會議</option>
                                    </select>
                                </div>
                                <div class="flex-1 grid grid-cols-[1fr_auto] items-end gap-2">
                                    <div class="flex-1 w-full">
                                        <label for="fileSelect"
                                            class="block mb-1 text-[#205f72] font-semibold">選擇檔案</label>
                                        <select id="fileSelect"
                                            class="w-full px-5 py-3 bg-white border border-[#cedfe4] rounded-lg">
                                            <option value="">請選擇檔案</option>
                                        </select>
                                    </div>
                                    <div class="flex flex-col items-center">
                                        <button id="generate-summary" title="AI 生成會議摘要"
                                            class="w-11 h-11 rounded-full flex items-center justify-center bg-[#205f72] hover:bg-[#175c71] transition mb-2">
                                            <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
                                        </button>
                                        <span id="summary-progress"
                                            style="display:none; color:#205f72; font-size:14px;">AI 摘要產生中...</span>
                                    </div>


                                </div>

                            </div>
                            <textarea
                                class="w-full h-40 border-2 border-dashed border-[#cedfe4] rounded-xl p-4 text-gray-700 text-base resize-none bg-gray-100"
                                placeholder="會議摘要內容..." readonly></textarea>
                            <div class="flex justify-end">
                                <button id="copy-summary" title="複製"
                                    class="w-10 h-10 flex items-center justify-center rounded-full transition hover:bg-[#e4e5e5]">
                                    <i data-lucide="copy"
                                        class="w-5 h-5 text-gray-500 hover:text-[#205f72] transition"></i>
                                </button>
                                <button id="edit-summary" title="修改"
                                    class="w-10 h-10 flex items-center justify-center rounded-full transition hover:bg-[#e4e5e5]">
                                    <i data-lucide="edit-3"
                                        class="w-5 h-5 text-gray-500 hover:text-[#205f72] transition"></i>
                                </button>
                            </div>

                            <div class="dashed-box text-center mt-1">
                                <h2 class="text-2xl font-bold text-[#205f72]">修改紀錄</h2>
                                <div id="history-log" class="space-y-2 mt-4"></div>
                            </div>
                        </div>
                </section>
            </div>
        </main>
    </div>
    <!-- ==== 主要 JS ==== -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // === 側邊欄開關 ===
            window.toggleSidebar = function () {
                document.getElementById("sidebar").classList.toggle("collapsed");
            };

            // === 會議摘要區 ===
            const titleSelect = document.getElementById("meetingTitle");
            const fileSelect = document.getElementById("fileSelect");
            const summaryBtn = document.getElementById("generate-summary");
            const summaryProgress = document.getElementById("summary-progress");
            const summaryTextarea = document.querySelector("textarea");
            const copyBtn = document.getElementById("copy-summary");
            const editBtn = document.getElementById("edit-summary");
            const permission = window.PERMISSION || "view";

            // 🎯 權限控制：限制 view 不能編輯
            if (editBtn && summaryTextarea) {
                if (permission !== "主持人" && permission !== "edit") {
                    // 禁用編輯按鈕
                    editBtn.disabled = true;
                    editBtn.classList.add("cursor-not-allowed", "opacity-50");
                    editBtn.setAttribute("title", "您沒有權限");

                    const icon = editBtn.querySelector("i");
                    if (icon) icon.classList.remove("text-[#205f72]");
                    if (icon) icon.classList.add("text-gray-400");
                } else {
                    // 有權限才綁定事件
                    editBtn.addEventListener("click", () => {
                        summaryTextarea.removeAttribute("readonly");
                        summaryTextarea.style.backgroundColor = "#ffffff";
                        summaryTextarea.focus();
                    });
                }
            }

            // ✅ 複製功能不設限（可選擇加上權限判斷）
            if (copyBtn && summaryTextarea) {
                copyBtn.addEventListener("click", () => {
                    navigator.clipboard.writeText(summaryTextarea.value).then(() => {
                        alert("已複製到剪貼簿！");
                    }).catch(err => {
                        alert("複製失敗");
                    });
                });
            }

            let allMeetings = [];

            // 當 textarea 離開焦點時，自動儲存內容
            summaryTextarea.addEventListener("blur", () => {
                if (permission !== "主持人" && permission !== "edit") return;
                const meetingId = titleSelect.value;
                const filePath = fileSelect.value;
                const content = summaryTextarea.value;
                if (!meetingId || !filePath) return;
                if (content === lastSavedContent) return; // 沒改，不儲存
                // ✅ 發送儲存請求
                fetch(`/qa/api/summary/${meetingId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        file_path: filePath,
                        content
                    })
                }).then(res => {
                    if (res.ok) {
                        console.log("摘要已自動儲存 ✅");
                        lastSavedContent = content; // 更新已儲存內容
                        // ✅ 儲存成功後，還原為灰色底 & readonly 模式
                        summaryTextarea.setAttribute("readonly", true);
                        summaryTextarea.style.backgroundColor = "#f3f4f6"; // Tailwind 的 gray-100 (#f3f4f6) 或你之前的 #f5f8fa 也可
                        loadSummaryLogs(meetingId, filePath);

                    } else {
                        console.warn("摘要儲存失敗 ❌");
                    }
                }).catch(err => {
                    console.error("儲存摘要時發生錯誤：", err);
                });
            });


            // 載入「當前議題」的會議清單
            fetch(`/api/meetings_by_topic/${window.TOPIC_ID}`)
                .then(res => res.json())
                .then(data => {
                    allMeetings = data.meetings || [];
                    renderTitleOptions();
                });

            // 產生會議下拉選單
            function renderTitleOptions() {
                titleSelect.innerHTML = `<option value="">請選擇會議</option>` +
                    allMeetings.map(m => `<option value="${m.id}">${m.title}</option>`).join("");
                fileSelect.innerHTML = `<option value="">請選擇檔案</option>`;
            }

            // 選會議→載入檔案
            titleSelect.addEventListener("change", function () {
                const meetingId = titleSelect.value;
                fileSelect.innerHTML = `<option value="">請選擇檔案</option>`;
                summaryTextarea.value = "";
                if (!meetingId) return;
                fetch(`/api/meeting_files/${meetingId}`)
                    .then(res => res.json())
                    .then(data => {
                        fileSelect.innerHTML = `<option value="">請選擇檔案</option>` +
                            (data.files || []).map(f => `<option value="${f.file_path}">${f.file_name}（${f.file_type}）</option>`).join("");
                    });
            });

            // 選檔案時自動查詢摘要
            fileSelect.addEventListener("change", function () {
                const meetingId = titleSelect.value;
                const filePath = fileSelect.value;
                summaryTextarea.value = "";
                if (!meetingId || !filePath) return;
                fetch(`/qa/api/summary/${meetingId}?file_path=${encodeURIComponent(filePath)}`)
                    .then(res => res.json())
                    .then(data => {
                        summaryTextarea.value = (data.summary && data.summary.content) ? data.summary.content : "";
                        lastSavedContent = summaryTextarea.value;
                        loadSummaryLogs(meetingId, filePath);
                    });
            });

            // 產生摘要（AI）
            if (summaryBtn && summaryProgress) {
                summaryBtn.addEventListener("click", function () {
                    const meetingId = titleSelect.value;
                    const filePath = fileSelect.value;
                    if (!filePath || !meetingId) return alert("請先選擇會議與檔案！");
                    summaryBtn.disabled = true;
                    summaryProgress.style.display = "block"; // ✅ 顯示進度

                    fetch("/qa/api/llama_summarize", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            file_path: filePath,
                            meeting_id: meetingId
                        })
                    })
                        .then(res => res.json())
                        .then(data => {
                            console.log("llama_summarize 回傳：", data);
                            summaryBtn.disabled = false;
                            summaryProgress.style.display = "none"; // ✅ 成功後隱藏
                            if (data.summary) {
                                summaryTextarea.value = data.summary.trim();
                                saveSummary(meetingId, filePath, data.summary.trim());
                            } else {
                                summaryTextarea.value = data.message || "AI 產生失敗";
                            }
                        })
                        .catch(err => {
                            console.error("AI 摘要錯誤：", err);
                            summaryBtn.disabled = false;
                            summaryProgress.style.display = "none"; // ✅ 失敗也隱藏
                            summaryTextarea.value = "AI 產生失敗";
                        });
                });

            }
            // 取得修改紀錄，並渲染
            function loadSummaryLogs(meetingId, filePath) {
                const logBox = document.getElementById("history-log");
                logBox.innerHTML = ""; // 先清空

                if (!meetingId || !filePath) return;

                fetch(`/qa/api/summary_logs/${meetingId}?file_path=${encodeURIComponent(filePath)}`)
                    .then(res => res.json())
                    .then(data => {
                        const logs = data.logs || [];
                        if (logs.length === 0) {
                            logBox.innerHTML = "<div class='text-gray-400 text-sm'>目前無修改紀錄</div>";
                            return;
                        }
                        logBox.innerHTML = logs.map((l, idx) => `
        <div class="rounded-lg bg-gray-50 px-4 py-2 border border-[#cedfe4] text-left shadow-sm">
          <button type="button" class="w-full flex justify-between items-center font-semibold text-[#205f72] focus:outline-none group"
            onclick="toggleLogDetail('log-detail-${idx}')">
            <span>
              ${l.user_name || '未知使用者'}
              <span class="text-xs text-gray-500 ml-2">${l.modified_at ? l.modified_at.replace('T', ' ').replace('.000Z', '') : ''}</span>
            </span>
            <svg class="w-4 h-4 ml-2 transition-transform group-hover:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
          <div id="log-detail-${idx}" class="log-detail hidden mt-2 text-gray-700 text-sm whitespace-pre-line">${l.content || ''}</div>
        </div>
      `).join("");
                    })
                    .catch(() => {
                        logBox.innerHTML = "<div class='text-red-400'>載入紀錄失敗</div>";
                    });
            }

            function saveSummary(meetingId, filePath, content) {
                // 呼叫你的儲存 API
                fetch(`/qa/api/summary/${meetingId}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        file_path: filePath,
                        content
                    })
                }).then(res => {
                    if (res.ok) {
                        console.log("AI 摘要自動儲存成功");
                    } else {
                        console.warn("AI 摘要自動儲存失敗");
                    }
                }).catch(err => {
                    console.error("AI 摘要儲存時發生錯誤：", err);
                });
            }
            // 加在最下面 JS（建議直接貼進 script）
            window.toggleLogDetail = function (id) {
                const el = document.getElementById(id);
                if (!el) return;
                el.classList.toggle("hidden");
            }


            // 顯示會議名稱與日期
            const name = localStorage.getItem("currentMeetingName") || "未命名會議";
            const date = localStorage.getItem("currentMeetingDate") || "未指定日期";
            document.getElementById("meeting-date").textContent = date;
            document.getElementById("meeting-name").textContent = name;
            lucide.createIcons();
        });
    </script>


    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>

</body>

</html>
