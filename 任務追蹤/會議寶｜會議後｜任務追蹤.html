        // 會議/組織/議題 ID 來源優先序：Jinja → URL → localStorage
        function toNumOrNull(v) {
            v = (v ?? '').toString().trim();
            return v === '' ? null : Number(v);
        }

        function getContextIds() {
            const qs = new URLSearchParams(location.search);
            const jOrg = '';
            const jMeet = '102';
            const jTopic = '42';

            return {
                org_id:
                    toNumOrNull(jOrg) ??
                    toNumOrNull(qs.get('org_id')) ??
                    toNumOrNull(localStorage.getItem('current_org_id')) ??
                    toNumOrNull(localStorage.getItem('currentOrgId')) ?? // 兼容舊 key
                    null,

                meeting_id:
                    toNumOrNull(jMeet) ??
                    toNumOrNull(qs.get('meeting_id')) ??
                    toNumOrNull(localStorage.getItem('currentMeetingId')) ??
                    null,

                topic_id:
                    toNumOrNull(jTopic) ??
                    toNumOrNull(qs.get('topic_id')) ??
                    toNumOrNull(localStorage.getItem('current_topic_id')) ??
                    null,
            };
        }

        function todayStr() { return new Date().toISOString().split('T')[0]; }
        function fmtDateStr(s) { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function badge(status) {
            const map = { pending: 'bg-yellow-100 text-yellow-800', in_progress: 'bg-blue-100 text-blue-800', completed: 'bg-green-100 text-green-800' };
            const cls = map[status] || 'bg-gray-100 text-gray-800';
            return `<span class="px-2 py-1 rounded text-xs ${cls}">${status || 'pending'}</span>`;
        }

        // ========= 初始化（標題日期、icons、截止日 min） =========
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("meeting-name").textContent = localStorage.getItem("currentMeetingName") || "未命名會議";
            document.getElementById("meeting-date").textContent = localStorage.getItem("currentMeetingDate") || "未指定日期";
            document.getElementById("taskDueDate").setAttribute("min", todayStr());

            const ctx = getContextIds();
            if (ctx.org_id) localStorage.setItem('current_org_id', String(ctx.org_id));
            if (ctx.meeting_id) localStorage.setItem('currentMeetingId', String(ctx.meeting_id));
            if (ctx.topic_id) localStorage.setItem('current_topic_id', String(ctx.topic_id));
            lucide.createIcons();
            loadTasks(); // 進頁載入
        });

        // ========= 成員下拉 (負責人) =========
        async function loadAssigneesForMeeting(meetingId) {
            const sel = document.getElementById('assigneeId');
            sel.innerHTML = `<option value="" disabled selected>請選擇負責人</option>`;
            if (!meetingId) { sel.innerHTML = `<option value="" disabled selected>缺少 meeting_id</option>`; return; }
            const res = await fetch(`/api/participants?meeting_id=${encodeURIComponent(meetingId)}`);
            const data = await res.json();
            if (!data.success) throw new Error(data.message || '載入成員失敗');
            (data.members || []).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.user_id; opt.textContent = m.name || m.email || `ID ${m.user_id}`;
                sel.appendChild(opt);
            });
        }

        // ========= Modal 開關 =========
        function openTaskModal(task = null) {
            const modal = document.getElementById('taskModal');
            document.getElementById('modalTitle').textContent = task ? '編輯任務' : '新增任務';
            document.getElementById('taskForm').reset();
            document.getElementById('taskDueDate').setAttribute('min', todayStr());
            if (task) {
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskName').value = task.name || '';
                document.getElementById('taskDescription').value = task.description || '';
                document.getElementById('taskDueDate').value = fmtDateStr(task.due_date);
            } else {
                document.getElementById('taskId').value = '';
            }
            modal.classList.remove('hidden'); modal.classList.add('flex');
            loadAssigneesForMeeting(getContextIds().meeting_id).then(() => {
                if (task && task.assignee_id) {
                    document.getElementById('assigneeId').value = String(task.assignee_id);
                }
            }).catch(e => {
                console.error(e);
                document.getElementById('assigneeId').innerHTML = `<option value="" disabled selected>載入成員失敗</option>`;
            });
        }
        function closeTaskModal() { const m = document.getElementById('taskModal'); m.classList.add('hidden'); m.classList.remove('flex'); }

        // ========= 新增 / 更新 提交 =========
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { org_id, meeting_id, topic_id } = getContextIds();
            const id = document.getElementById('taskId').value || null;
            const payload = {
                org_id,
                meeting_id: meeting_id || null,
                topic_id: topic_id || null,
                name: document.getElementById('taskName').value.trim(),
                description: document.getElementById('taskDescription').value.trim(),
                due_date: document.getElementById('taskDueDate').value,
                assignee_id: Number(document.getElementById('assigneeId').value),
                status: 'pending'
            };
            if (!payload.org_id) { alert('缺少 org_id'); return; }
            if (!payload.assignee_id) { alert('請選擇負責人'); return; }
            if (!payload.name) { alert('請填任務名稱'); return; }
            if (!payload.due_date) { alert('請選擇截止日'); return; }
            if (payload.due_date < todayStr()) { alert('截止日不能早於今天'); return; }

            try {
                let res, data;
                if (id) {
                    res = await fetch(`/api/task/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                } else {
                    res = await fetch(`/api/task`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                }
                data = await res.json();
                if (!res.ok || !data.success) { throw new Error(data.message || '儲存失敗'); }
                closeTaskModal();
                await loadTasks();
                alert('✅ 任務已儲存');
            } catch (err) {
                console.error(err);
                alert('❌ ' + err.message);
            }
        });

        // ========= 列表讀取 & 渲染 =========
        async function loadTasks() {
            const { org_id, meeting_id, topic_id } = getContextIds();
            if (!org_id) { tbody.innerHTML = `<tr><td colspan="8" class="p-3 text-center text-gray-500">缺少 org_id，無法載入</td></tr>`; return; }
            const qs = new URLSearchParams({ org_id });
            if (meeting_id) qs.set('meeting_id', meeting_id);
            if (topic_id) qs.set('topic_id', topic_id);

            tbody.innerHTML = `<tr><td colspan="8" class="p-3 text-center text-gray-500">載入中…</td></tr>`;
            try {
                const res = await fetch(`/api/tasks?${qs.toString()}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.message || '載入失敗');
                renderTaskRows(data.tasks || []);
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="8" class="p-3 text-center text-red-600">❌ 載入失敗</td></tr>`;
            }
        }

        function renderTaskRows(list) {
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-3 text-center text-gray-500">目前沒有任務</td></tr>`;
                return;
            }
            const currentUserId = Number(localStorage.getItem('user_id')); // 你前端已有
            tbody.innerHTML = list.map(t => {
                const canEdit = Number(t.assigner_id) === currentUserId; // 只有指派者可編/刪
                return `
      <tr class="border-b">
        <td class="p-2">${t.name || ''}</td>
        <td class="p-2">${(t.description || '').replaceAll('<', '&lt;')}</td>
        <td class="p-2">${t.assignee_name || t.assignee_email || t.assignee_id || ''}</td>
        <td class="p-2">${fmtDateStr(t.due_date)}</td>
        <td class="p-2">${badge(t.status)}</td>
        <td class="p-2">${t.assigner_name || t.assigner_email || t.assigner_id || ''}</td>
        <td class="p-2">${fmtDateStr(t.assign_date || t.created_at)}</td>
        <td class="p-2">
          <div class="flex gap-2">
            <button class="text-sm underline ${canEdit ? '' : 'opacity-30 pointer-events-none'}"
                    onclick='onEditTask(${JSON.stringify(t.id)})'>編輯</button>
            <button class="text-sm text-red-600 underline ${canEdit ? '' : 'opacity-30 pointer-events-none'}"
                    onclick='onDeleteTask(${JSON.stringify(t.id)})'>刪除</button>
          </div>
        </td>
      </tr>
    `;
            }).join('');
        }

        async function onEditTask(id) {
            // 取最新資料再開 modal（也可直接用列表中的物件）
            const { org_id, meeting_id, topic_id } = getContextIds();
            const qs = new URLSearchParams({ org_id });
            if (meeting_id) qs.set('meeting_id', meeting_id);
            if (topic_id) qs.set('topic_id', topic_id);
            const res = await fetch(`/api/tasks?${qs.toString()}`);
            const data = await res.json();
            const t = (data.tasks || []).find(x => x.id === id);
            if (!t) { alert('找不到任務'); return; }
            openTaskModal(t);
        }

        async function onDeleteTask(id) {
            if (!confirm('確定刪除這個任務？')) return;
            try {
                const res = await fetch(`/api/task/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.message || '刪除失敗');
                await loadTasks();
                alert('🗑️ 已刪除');
            } catch (e) {
                console.error(e);
                alert('❌ ' + e.message);
            }
        }

        //結束會議
        function endMeeting() {
            const meetingId = "102";
            if (!confirm("確定要結束會議嗎？")) return;

            // 先蒐集現有值（網址 / localStorage / window.MEETING / Jinja）
            const qs = new URLSearchParams(location.search);
            let orgId =
                qs.get("org_id") ||
                localStorage.getItem("current_org_id") ||
                (window.MEETING && window.MEETING.org_id) ||
                "" || "";

            let topicId =
                qs.get("topic_id") ||
                localStorage.getItem("current_topic_id") ||
                (window.MEETING && window.MEETING.topic_id) ||
                "42" || "";

            fetch(`/api/meeting/${meetingId}/end`, { method: "POST" })
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        alert("❌ " + (data.message || "結束會議失敗"));
                        return;
                    }

                    // ✅ 優先使用後端回傳
                    if (data.org_id) orgId = String(data.org_id);
                    if (data.topic_id) topicId = String(data.topic_id);

                    // 存起來以便其他頁使用
                    if (orgId) localStorage.setItem("current_org_id", orgId);
                    if (topicId) localStorage.setItem("current_topic_id", topicId);

                    alert("✅ 會議已結束");

                    // 有什麼帶什麼
                    if (orgId && topicId) {
                        location.href = `/meeting?org_id=${encodeURIComponent(orgId)}&topic_id=${encodeURIComponent(topicId)}`;
                    } else if (orgId) {
                        location.href = `/meeting?org_id=${encodeURIComponent(orgId)}`;
                    } else {
                        location.href = `/meeting`;
                    }
                })
                .catch(err => {
                    console.error("結束會議 API 錯誤", err);
                    alert("⚠️ 系統錯誤");
                });
        }

    </script>
    <script>
        lucide.createIcons();
    </script>


</body></html>
