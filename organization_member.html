<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會議寶｜組織成員</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar_b.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .btn-primary {
      background-color: #205f72;
    }

    .btn-primary:hover {
      background-color: #175c71;
    }

    .card {
      background-color: #cedfe4;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="navbar-toggle" onclick="toggleSidebar()" id="toggleBtn">
        <i data-lucide="align-justify" class="w-6 h-6 stroke-[#205f72]"></i>
      </button>
      <nav class="menu">
        <div class="sidebar-item cursor-default hover:bg-transparent select-none">
          <i data-lucide="building" class="sidebar-icon stroke-[#205f72]"></i>
          <div class="flex flex-col leading-snug">
            <span class="text-xs text-gray-500">目前組織</span>
            <span id="meeting-date" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
            <span id="meeting-name" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
          </div>
        </div>
        <a href="{{ url_for('build_organization_page') }}" class="sidebar-item flex items-center gap-2">
          <i data-lucide="home" class="sidebar-icon"></i>
          <span>首頁</span>
        </a>
        <a href="{{ url_for('signin_page') }}" class="sidebar-item flex items-center gap-2">
          <i data-lucide="log-out" class="sidebar-icon"></i>
          <span>登出</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <a href="{{ url_for('build_organization_page') }}">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" class="logo-img" />
          </a>
        </div>
        <div class="header-right">
          <a href="{{ url_for('organization_member_page', org_id=org_id) }}">
            <img src="{{ url_for('static', filename='image/head.png') }}" alt="Head" class="avatar-img" />
          </a>
        </div>
      </header>

      <div class="w-full max-w-4xl mx-auto px-4 mt-6">
        <h2 class="text-center text-[#205f72] text-2xl font-bold mb-4">組織成員列表</h2>
        <div class="flex flex-col gap-3 mb-8" id="memberList">
          {% if members %}
          {% for m in members %}
          <div id="member-{{ m.user_id }}"
            class="bg-white border border-gray-300 rounded px-4 py-3 flex justify-between items-center">
            <div>
              <span class="text-sm text-gray-800">{{ m.email }}</span>
              <span class="text-xs text-gray-500 ml-2">{{ m.role }}</span>
            </div>
            <button onclick="deleteMember({{ m.org_id }}, {{ m.user_id }}, '{{ m.email }}')"
              class="ml-2 text-red-600 hover:text-red-800" title="移除成員">
              <i data-lucide="x-circle" class="w-5 h-5"></i>
            </button>
          </div>
          {% endfor %}
          {% else %}
          <p class="text-center text-gray-600">尚無組織成員</p>
          {% endif %}
        </div>

        <div class="card">
          <h3 class="text-lg font-bold text-[#205f72] mb-3">新增成員</h3>
          <div class="flex flex-col md:flex-row md:items-center gap-2">
            <input id="newMemberEmail" type="email" placeholder="請輸入Email"
              class="flex-1 p-3 rounded-lg border border-gray-300 focus:outline-none" />
            <button onclick="addNewMember()" class="btn-primary text-white px-4 py-2 rounded-lg">
              發送邀請
            </button>
          </div>
          
        </div>
      </div>
    </main>
  </div>


  <script>
    // 刪除按鈕觸發
    function deleteMember(orgId, userId, email) {
      if (!confirm(`確定要移除 ${email} 嗎？`)) return;

      fetch(`/api/organization_members/${orgId}/${userId}`, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" }
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            // 這裡會移除剛才加上 id 的 <div>
            document.getElementById(`member-${userId}`).remove();
            alert("已移除：" + email);
          } else {
            alert("刪除失敗：" + result.message);
          }
        })
        .catch(err => {
          console.error(err);
          alert("發生錯誤，請重試");
        });
    }


    // 新增成員（保持你原本邏輯不變）
    function addNewMember() {
      const input = document.getElementById("newMemberEmail");
      const email = input.value.trim();
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert("請輸入有效的 Email 地址");
        return;
      }
      const orgId = "{{ org_id }}";
      fetch(`/api/organization_members/${orgId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
      })
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            alert("邀請已發送給：" + email);
            window.location.reload();
          } else {
            alert("新增失敗：" + result.message);
          }
        })
        .catch(err => {
          console.error(err);
          alert("發生錯誤：" + err);
        });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
</body>

</html>
