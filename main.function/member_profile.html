<!DOCTYPE html> 
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會議寶｜會員資訊</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar_b.css') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
<button class="navbar-toggle" onclick="toggleSidebar()" id="toggleBtn">
  <i data-lucide="menu" id="toggleIcon" class="w-6 h-6 text-[#205f72]"></i> 
</button>
      <nav class="menu">
        <a href="{{ url_for('build_organization_page') }}" class="sidebar-item flex items-center gap-2">
          <i data-lucide="home" class="sidebar-icon"></i>
          <span>首頁</span>
        </a>
        <a href="{{ url_for('signin_page') }}" class="sidebar-item flex items-center gap-2">
          <i data-lucide="log-out" class="sidebar-icon"></i>
          <span>登出</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <a href="{{ url_for('build_organization_page') }}">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" class="logo-img" id="logoImg" />
          </a>
        </div>
        <div class="header-right">
          <a href="{{ url_for('member_profile_page') }}">
            <img src="{{ url_for('static', filename='image/head.png') }}" alt="Head" class="avatar-img" />
          </a>
        </div>
      </header>

      <!-- 會員資訊卡片 -->
      <div class="flex justify-center items-center py-10">
      <div class="bg-[#cedfe4] w-full max-w-md p-6 rounded-2xl shadow-xl border border-dashed border-[#cedfe4]">
      <!-- 標題 -->
      <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-[#205f72]">會員資訊</h1>
      </div>

      <!-- 表單 -->
      <form method="POST" action="/update_profile" class="space-y-4"> <!--加上 POST & action -->

<!-- 姓名 -->
<div class="flex justify-center">
  <div class="w-full max-w-sm">
    <label class="block font-semibold text-[#205f72] mb-1">姓名</label>
    <input type="text" name="name" placeholder="輸入新姓名" value="{{ user.name }}"
      class="w-full px-3 py-2 rounded-md border border-[#205f72] focus:outline-none focus:ring-2 focus:ring-[#205f72]">
  </div>
</div>
<!-- 帳號 -->
<div class="flex justify-center">
  <div class="w-full max-w-sm">
    <label class="block font-semibold text-[#205f72] mb-1">帳號</label>
    <input type="text" value="{{ user.email }}" disabled
      class="w-full px-3 py-2 rounded-md bg-[#f5f8fa] text-gray-500 border border-[#205f72]">
  </div>
</div>
<!-- 密碼 -->
<div class="flex justify-center">
  <div class="w-full max-w-sm">
    <label class="block font-semibold text-[#205f72] mb-1">密碼</label>
    <input type="password" name="password" placeholder="輸入新密碼"
      class="w-full px-3 py-2 rounded-md border border-[#205f72] focus:outline-none focus:ring-2 focus:ring-[#205f72]">
  </div>
</div>

      <!-- 送出 -->
      <div class="text-center pt-4">
        <button type="submit"
                class="bg-[#205f72] text-white font-semibold px-6 py-2 rounded-full hover:bg-[#175c71]">
          送出
        </button>
      </div>
    </form>

        </div>
      </div>
    </main>
  </div>
</body>
</html>


<script>
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('collapsed');
  }

  // 初始化 Lucide Icons
  lucide.createIcons();
</script>
