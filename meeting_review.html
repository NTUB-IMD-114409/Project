<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>會議寶｜會議後｜會議回顧</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar_a.css') }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5f8fa;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
    }

    .main-wrapper {
      height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 20px 16px;
    }

    .dashed-box {
      border: 2px dashed #cedfe4;
      border-radius: 20px;
      background-color: #ffffff;
      padding: 24px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
    }

    .btn-primary {
      background-color: #205f72;
    }

    .btn-primary:hover {
      background-color: #175c71;
    }

    button[title] {
      transition: background-color 0.2s ease;
    }

    select {
      appearance: none;
    }

    textarea {
      resize: none;
    }

    .bg-green-500 {
      background-color: #48bb78;
    }

    .disabled-edit-btn {
      color: #AAA !important;
      cursor: not-allowed !important;
      /* 刪除 pointer-events: none; */
    }

    .disabled-edit-btn svg {
      stroke: #AAA !important;
    }
  </style>
</head>

<body>
  <script>
    window.PERMISSION = "{{ role }}";</script>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <button class="navbar-toggle" onclick="toggleSidebar()" id="toggleBtn">
        <i data-lucide="align-justify" class="w-6 h-6 stroke-[#205f72]"></i>
      </button>
      <nav class="menu">
        <!-- ...sidebar內容... -->
        <div class="sidebar-item cursor-default hover:bg-transparent select-none">
          <i data-lucide="building" class="sidebar-icon stroke-[#205f72]"></i>
          <div class="flex flex-col leading-snug">
            <span class="text-xs text-gray-500">目前會議</span>
            <span id="meeting-date" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
            <span id="meeting-name" class="text-[#205f72] text-sm font-semibold truncate max-w-[180px]"></span>
          </div>
        </div>
        <a href="{{ url_for('build_organization_page') }}" class="sidebar-item"><i data-lucide="home"
            class="sidebar-icon"></i><span>首頁</span></a>
        <a id="startMeetingLink" href="#" class="sidebar-item flex items-center gap-2">
          <i data-lucide="user-plus" class="sidebar-icon"></i>
          <span>發起會議</span>
        </a>

        <script>
          document.addEventListener("DOMContentLoaded", () => {
            const orgId = localStorage.getItem("currentOrgId");
            const link = document.getElementById("startMeetingLink");
            if (link && orgId) {
              link.href = `/start_meeting?org_id=${orgId}`;
            }
          });
        </script>
        <a href="{{ url_for('meeting_after_file_upload_page', meeting_id=meeting_id) }}" class="sidebar-item"><i
            data-lucide="file-plus" class="sidebar-icon"></i><span>檔案上傳</span></a>
        <a href="{{ url_for('transcript_file_page', meeting_id=meeting_id) }}" class="sidebar-item"><i data-lucide="mic"
            class="sidebar-icon"></i><span>語音轉文字</span></a>
        <a href="{{ url_for('meeting_review_page', meeting_id=meeting_id) }}" class="sidebar-item"><i
            data-lucide="folder-search-2" class="sidebar-icon"></i><span>會議回顧</span></a>
        <a href="{{ url_for('meeting_formal_doc_page', meeting_id=meeting_id) }}" class="sidebar-item"><i
            data-lucide="file-text" class="sidebar-icon"></i><span>正式文件</span></a>
        <a href="{{ url_for('signin_page') }}" class="sidebar-item"><i data-lucide="log-out"
            class="sidebar-icon"></i><span>登出</span></a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="header">
        <div class="header-left">
          <a href="{{ url_for('build_organization_page') }}">
            <img src="{{ url_for('static', filename='image/logo.png') }}" alt="Logo" class="logo-img" />
          </a>
        </div>
        <div class="progress-bar">
          <div class="step-group">
            <div class="circle gray-completed"></div>
            <div class="label label-gray">前</div>
          </div>
          <div class="line solid-gray"></div>
          <div class="step-group">
            <div class="circle gray-completed"></div>
            <div class="label label-gray">中</div>
          </div>
          <div class="line solid-gray"></div>
          <div class="step-group">
            <div class="circle green-completed"></div>
            <div class="label label-green">後</div>
          </div>
        </div>
        <div class="header-right">
          <a href="{{ url_for('meeting_member3_page', meeting_id=meeting_id) }}">
            <img src="{{ url_for('static', filename='image/head.png') }}" alt="Head" class="avatar-img" />
          </a>
        </div>
      </header>

      <div class="main-wrapper">
        <section class="flex justify-center px-4">
          <div class="w-full max-w-4xl space-y-6">
            <div class="dashed-box">
              <h2 class="text-2xl font-bold text-[#205f72] mb-6 text-center w-full">會議摘要</h2>
              <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="flex-1">
                  <label for="meetingTitle" class="block mb-1 text-[#205f72] font-semibold">選擇會議</label>
                  <select id="meetingTitle"
                    class="w-full px-5 py-3 bg-white border border-[#cedfe4] text-black rounded-lg">
                    <option value="">請選擇會議</option>
                  </select>
                </div>
                <div class="flex-1 flex items-end gap-2">
                  <div class="flex-1">
                    <label for="fileSelect" class="block mb-1 text-[#205f72] font-semibold">選擇檔案</label>
                    <select id="fileSelect" class="w-full px-5 py-3 bg-white border border-[#cedfe4] rounded-lg">
                      <option value="">請選擇檔案</option>
                    </select>
                  </div>
                  <div class="flex flex-col items-center">
                    <button id="generate-summary" title="AI 生成會議摘要"
                      class="w-11 h-11 rounded-full flex items-center justify-center bg-[#205f72] hover:bg-[#175c71] transition mb-2">
                      <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
                    </button>
                    <span id="summary-progress" style="display:none; color:#205f72; font-size:14px;">AI 摘要產生中...</span>
                  </div>


                </div>

              </div>
              <textarea
                class="w-full h-40 border-2 border-dashed border-[#cedfe4] rounded-xl p-4 text-gray-700 text-base resize-none"
                placeholder="會議摘要內容..."></textarea>

              <div class="flex justify-end gap-4 mt-4">
                <button title="複製" class="p-2 rounded-full hover:bg-gray-100 transition"><i data-lucide="copy"
                    class="w-5 h-5"></i></button>
                <!-- 把 title="編輯" 移除！ -->
                <button id="edit-btn" class="p-2 rounded-full hover:bg-gray-100 transition">
                  <i data-lucide="pencil" class="w-5 h-5"></i>
                </button>
              </div>
            </div>
            <div class="dashed-box text-center">
              <h2 class="text-2xl font-bold text-[#205f72]">修改紀錄</h2>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <!-- ==== 主要 JS ==== -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // === 側邊欄開關 ===
      window.toggleSidebar = function () {
        document.getElementById("sidebar").classList.toggle("collapsed");
      };

      // === 會議摘要區 ===
      const titleSelect = document.getElementById("meetingTitle");
      const fileSelect = document.getElementById("fileSelect");
      const summaryBtn = document.getElementById("generate-summary");   // 產生摘要按鈕
      const summaryProgress = document.getElementById("summary-progress"); // 進度圈圈
      const summaryTextarea = document.querySelector("textarea");

      // 載入會議清單
      let allMeetings = [];
      fetch("/api/my_meetings_simple")
        .then(res => res.json())
        .then(data => {
          if (!data.success) return alert("載入會議失敗！");
          allMeetings = data.meetings || [];
          renderTitleOptions();
        });

      // 產生會議下拉選單
      function renderTitleOptions() {
        titleSelect.innerHTML = `<option value="">請選擇會議</option>` +
          allMeetings.map(m => `<option value="${m.id}">${m.title}</option>`).join("");
        fileSelect.innerHTML = `<option value="">請選擇檔案</option>`;
      }

      // 選會議→載入檔案
      titleSelect.addEventListener("change", function () {
        const meetingId = titleSelect.value;
        if (!meetingId) {
          fileSelect.innerHTML = `<option value="">請選擇檔案</option>`;
          return;
        }
        fetch(`/api/meeting_files/${meetingId}`)
          .then(res => res.json())
          .then(data => {
            fileSelect.innerHTML = `<option value="">請選擇檔案</option>` +
              (data.files || []).map(f => `<option value="${f.file_path}">${f.file_name}（${f.file_type}）</option>`).join("");
          });
      });

      // 產生摘要
      if (summaryBtn && summaryProgress) {
        summaryBtn.addEventListener("click", function () {
          const filePath = fileSelect.value;
          if (!filePath) return alert("請先選擇檔案！");

          summaryBtn.disabled = true;
          summaryProgress.style.display = "block";

          fetch("/api/llama_summarize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ file_path: filePath })
          })
            .then(res => res.json())
            .then(data => {
              if (summaryTextarea) {
                summaryTextarea.value = data.summary || "AI 產生失敗";
              }
            })
            .catch(() => {
              if (summaryTextarea) {
                summaryTextarea.value = "AI 產生失敗";
              }
            })
            .finally(() => {
              summaryBtn.disabled = false;
              summaryProgress.style.display = "none";
            });
        });
      }

      // === 權限控制區 ===
      const editBtn = document.getElementById("edit-btn");
      const canEdit = ["主持人", "edit"];
      if (!canEdit.includes(window.PERMISSION)) {
        if (editBtn) {
          editBtn.classList.add("disabled-edit-btn");
          editBtn.setAttribute("disabled", "disabled");
          editBtn.setAttribute("title", "您沒有權限");
        }
        if (summaryTextarea) {
          summaryTextarea.setAttribute("disabled", "disabled");
          summaryTextarea.setAttribute("title", "您沒有權限");
          summaryTextarea.style.background = "#edebeb";
          summaryTextarea.style.cursor = "not-allowed";
        }
      } else {
        if (editBtn) {
          editBtn.classList.remove("disabled-edit-btn");
          editBtn.removeAttribute("disabled");
          editBtn.setAttribute("title", "編輯摘要");
        }
        if (summaryTextarea) {
          summaryTextarea.removeAttribute("disabled");
          summaryTextarea.removeAttribute("title");
          summaryTextarea.style.background = "#fff";
          summaryTextarea.style.cursor = "text";
        }
      }
    });
              document.addEventListener("DOMContentLoaded", () => {
            const name = localStorage.getItem("currentMeetingName") || "未命名會議";
            const date = localStorage.getItem("currentMeetingDate") || "未指定日期";
            document.getElementById("meeting-date").textContent = date;
            document.getElementById("meeting-name").textContent = name;
            lucide.createIcons();  // 僅初始化一次
          });
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>lucide.createIcons();</script>

</body>

</html>
